
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Romance Rails - Otsuka Station</title>
  <link href="style.css" rel="stylesheet">
  <style>
    #skip-button {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1001;
    }
    .money-warning {
      color: red;
      font-size: 0.8em;
      display: none; /* Hidden by default */
    }
    .status {
      font-size: 0.8em;
      color: #888;
    }
    #video-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #video-player {
      max-width: 90%;
      max-height: 90vh;
      width: auto;
      height: auto;
    }
  </style>
</head>
<body class="otsuka-station-background">

  <div id="sidebar" class="sidebar">
  <a href="javascript:void(0)" class="closebtn" onclick="toggleNav()">&times;</a>
  <h1>Romance Rails</h1>
  <div id="clock-container">
    <p id="clock"></p>
  </div>
  <div id="location-container">
    <p>Location:</p>
    <p id="location-name"></p>
  </div>
  <div id="money-container">
    <p>Money:</p>
    <p id="money-amount"></p>
  </div>
  <div id="grope-level-container">
    <p style="color: white;">Grope Level:</p>
    <p id="grope-level-amount" style="color: white;"></p>
  </div>
  <div class="sidebar-options">
    <a href="javascript:restartGame()">Restart</a>
    <a href="javascript:saveGame()">Save</a>
    <a href="javascript:importGame()">Import</a>
    <a href="https://www.patreon.com/cw/RomanceRails" target="_blank">Patreon</a>
  </div>
</div>
  <button class="openbtn" onclick="toggleNav()">&#9776; Open Sidebar</button>

  <div id="main">
    <h1>Welcome to Otsuka Station!</h1>
    <div class="card-container">
      <div id="train-station-card" class="dropdown card">
        <h3>Train Station</h3>
        <div class="dropdown-content">
            <a href="#" onclick="goToTrainStation(event, 'Ikebukuro')">Ikebukuro (¥140)</a>
        </div>
        <span id="train-station-status" class="status"></span>
        <div id="train-money-warning" class="money-warning">Not enough money for the train fare.</div>
      </div>
      <div class="dropdown card">
        <h3>Sleep</h3>
        <div class="dropdown-content">
          <a href="#" onclick="sleepOnTheStreet()">Sleep on the street</a>
        </div>
      </div>
      <div class="dropdown card">
        <h3>Work</h3>
        <div class="dropdown-content">
          <a href="#" onclick="begForMoney()">Beg for money on the street</a>
        </div>
      </div>
    </div>
  </div>

  <div id="video-container">
    <video id="video-player" controls>
      <source src="videos/Sleep on the street.mp4" type="video/mp4">
    </video>
    <button id="skip-button" onclick="skipVideo()">Skip</button>
  </div>

  <script src="game.js"></script>
  <script src="locations.js"></script>
  <script>
    const trainFare = 140;

    setLocation("Otsuka Station");

    function updateStationStatus() {
      const gameTime = new Date(parseInt(localStorage.getItem('gameTime')));
      const hours = gameTime.getHours();
      const minutes = gameTime.getMinutes();
      const currentMoney = parseInt(localStorage.getItem('money')) || 0;

      const trainStationCard = document.getElementById('train-station-card');
      const trainStationStatus = document.getElementById('train-station-status');
      const trainMoneyWarning = document.getElementById('train-money-warning');
      const trainLinks = trainStationCard.querySelectorAll('.dropdown-content a');

      // Train Station: 4:30 AM to 1:00 AM
      const trainStationOpen = (hours > 4 || (hours === 4 && minutes >= 30)) || hours < 1;
      if (trainStationOpen) {
        trainStationStatus.textContent = "Open";
        trainStationCard.style.opacity = 1;
        if (currentMoney < trainFare) {
            trainMoneyWarning.style.display = 'block';
            trainLinks.forEach(link => link.style.pointerEvents = 'none');
        } else {
            trainMoneyWarning.style.display = 'none';
            trainLinks.forEach(link => link.style.pointerEvents = 'auto');
        }
      } else {
        trainStationStatus.textContent = "Closed";
        trainStationCard.style.opacity = 0.5;
        trainMoneyWarning.style.display = 'none';
        trainLinks.forEach(link => link.style.pointerEvents = 'none');
      }
    }

    function goToTrainStation(event, station) {
        event.preventDefault(); // Prevent the link from navigating immediately

        const currentMoney = parseInt(localStorage.getItem('money')) || 0;
        if (currentMoney < trainFare) {
            alert("You don't have enough money for the train fare.");
            return;
        }

        const mainContent = document.getElementById('main');
        const videoContainer = document.getElementById('video-container');
        const videoPlayer = document.getElementById('video-player');
        const skipButton = document.getElementById('skip-button');

        let videoSource = 'videos/Traveling Train.mp4';
        let isSpecialVideo = false;
        if (station === 'Ikebukuro' && Math.random() < 0.1) {
            videoSource = 'videos/Hibiki Amemiya (1).mp4';
            isSpecialVideo = true;
            onSpecialVideoPlay();
        }

        videoPlayer.querySelector('source').src = videoSource;
        videoPlayer.load();

        mainContent.style.display = 'none';
        videoContainer.style.display = 'flex';
        videoPlayer.play();

        if (isSpecialVideo && station === 'Ikebukuro' && checkGropeLevelForHibiki()) {
          videoPlayer.onended = () => playHibikiAmemiyaPart2(station);
          skipButton.onclick = () => playHibikiAmemiyaPart2(station);
        } else {
          videoPlayer.onended = () => skipTrainVideo(station);
          skipButton.onclick = () => skipTrainVideo(station);
        }
    }

    function playHibikiAmemiyaPart2(station) {
      const videoPlayer = document.getElementById('video-player');
      const skipButton = document.getElementById('skip-button');

      videoPlayer.querySelector('source').src = 'videos/Hibiki Amemiya (2).mp4';
      videoPlayer.load();
      videoPlayer.play();

      videoPlayer.onended = () => skipTrainVideo(station);
      skipButton.onclick = () => skipTrainVideo(station);
    }

    function checkGropeLevelForHibiki() {
        let gropeLevel = localStorage.getItem('gropeLevel') ? parseInt(localStorage.getItem('gropeLevel')) : 0;
        return gropeLevel >= 25;
    }

    function skipTrainVideo(station) {
        const videoContainer = document.getElementById('video-container');
        const mainContent = document.getElementById('main');
        const videoPlayer = document.getElementById('video-player');

        videoPlayer.pause();
        videoContainer.style.display = 'none';
        mainContent.style.display = 'block';

        let currentMoney = parseInt(localStorage.getItem('money')) || 0;
        currentMoney -= trainFare;
        localStorage.setItem('money', currentMoney);

        if (station === 'Ikebukuro') {
            advanceTime(0, 5);
            window.location.href = "ikebukuro-station.html";
        }

        updateStationStatus();
        updateClock();
        updateMoney();
    }

    function sleepOnTheStreet() {
      const mainContent = document.getElementById('main');
      const videoContainer = document.getElementById('video-container');
      const videoPlayer = document.getElementById('video-player');
      const skipButton = document.getElementById('skip-button');

      let videoSource = 'videos/Sleep on the street.mp4';
        let isSpecialVideo = false;
      if (Math.random() < 0.1) {
          videoSource = 'videos/Mei Matsumoto (1).mp4';
            isSpecialVideo = true;
      }

      videoPlayer.querySelector('source').src = videoSource;
      videoPlayer.load();

      mainContent.style.display = 'none';
      videoContainer.style.display = 'flex';
      videoPlayer.play();

        if (isSpecialVideo && checkGropeLevelForMei()) {
            videoPlayer.onended = () => playMeiMatsumotoPart2();
            skipButton.onclick = () => playMeiMatsumotoPart2();
        } else {
            videoPlayer.onended = skipVideo;
            skipButton.onclick = skipVideo;
        }
    }

    function playMeiMatsumotoPart2() {
        const videoPlayer = document.getElementById('video-player');
        const skipButton = document.getElementById('skip-button');

        videoPlayer.querySelector('source').src = 'videos/Mei Matsumoto (2).mp4';
        videoPlayer.load();
        videoPlayer.play();

        videoPlayer.onended = skipVideo;
        skipButton.onclick = skipVideo;
    }

    function checkGropeLevelForMei() {
        const gropeLevel = localStorage.getItem('gropeLevel') ? parseInt(localStorage.getItem('gropeLevel')) : 0;
        return gropeLevel >= 30;
    }

    function skipVideo() {
      const videoContainer = document.getElementById('video-container');
      const mainContent = document.getElementById('main');
      const videoPlayer = document.getElementById('video-player');

      videoPlayer.pause();
      videoContainer.style.display = 'none';
      mainContent.style.display = 'block';
      advanceTime(8, 0);
      updateStationStatus();
      updateClock();
    }

    function begForMoney() {
      const mainContent = document.getElementById('main');
      const videoContainer = document.getElementById('video-container');
      const videoPlayer = document.getElementById('video-player');
      const skipButton = document.getElementById('skip-button');

      let videoSource = 'videos/Beg for Money.mp4';
        let isSpecialVideo = false;
      if (Math.random() < 0.1) {
          videoSource = 'videos/Mei Matsumoto (1).mp4';
            isSpecialVideo = true;
      }

      videoPlayer.querySelector('source').src = videoSource;
      videoPlayer.load();

      mainContent.style.display = 'none';
      videoContainer.style.display = 'flex';
      videoPlayer.play();

        if (isSpecialVideo && checkGropeLevelForMei()) {
            videoPlayer.onended = () => playMeiMatsumotoPart2OnBeg();
            skipButton.onclick = () => playMeiMatsumotoPart2OnBeg();
        } else {
            videoPlayer.onended = skipBeggingVideo;
            skipButton.onclick = skipBeggingVideo;
        }
    }

    function playMeiMatsumotoPart2OnBeg() {
        const videoPlayer = document.getElementById('video-player');
        const skipButton = document.getElementById('skip-button');

        videoPlayer.querySelector('source').src = 'videos/Mei Matsumoto (2).mp4';
        videoPlayer.load();
        videoPlayer.play();

        videoPlayer.onended = skipBeggingVideo;
        skipButton.onclick = skipBeggingVideo;
    }

    function skipBeggingVideo() {
      const videoContainer = document.getElementById('video-container');
      const mainContent = document.getElementById('main');
      const videoPlayer = document.getElementById('video-player');

      videoPlayer.pause();
      videoContainer.style.display = 'none';
      mainContent.style.display = 'block';

      const moneyEarned = Math.floor(Math.random() * (1000 - 100 + 1)) + 100;
      let currentMoney = parseInt(localStorage.getItem('money')) || 0;
      currentMoney += moneyEarned;
      localStorage.setItem('money', currentMoney);

      advanceTime(2, 0);
      updateStationStatus();
      updateClock();
      updateMoney();
    }

    function onSpecialVideoPlay() {
      let gropeLevel = localStorage.getItem('gropeLevel') ? parseInt(localStorage.getItem('gropeLevel')) : 0;
      gropeLevel++;
      localStorage.setItem('gropeLevel', gropeLevel);
      updateGropeLevel();
    }

    document.addEventListener('DOMContentLoaded', function() {
      initializeTime();
      updateStationStatus();
      updateGropeLevel();
    });

    function toggleNav() {
      var sidebar = document.getElementById("sidebar");
      var main = document.getElementById("main");
      if (sidebar.style.width === "250px") {
        sidebar.style.width = "0";
        main.style.marginLeft = "0";
      } else {
        sidebar.style.width = "250px";
        main.style.marginLeft = "250px";
      }
    }

    function setLocation(location) {
      const locationNameElement = document.getElementById("location-name");
      if (locationNameElement) {
        locationNameElement.textContent = location;
        updateClock();
        updateMoney();
        updateGropeLevel();
      }
    }

    function updateClock() {
      const clockElement = document.getElementById('clock');
      if (!clockElement) return;

      const gameTimeValue = localStorage.getItem('gameTime');
      const gameTime = new Date(parseInt(gameTimeValue));

      if (isNaN(gameTime.getTime())) {
        clockElement.textContent = "--:-- --";
        return;
      }

      let hours = gameTime.getHours();
      const minutes = gameTime.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const timeString = hours + ':' + minutes + ' ' + ampm;
      
      clockElement.textContent = timeString;

      if (typeof updateStationStatus === 'function') {
        updateStationStatus();
      }
    }

    function initializeMoney() {
      if (localStorage.getItem('money') === null) {
        localStorage.setItem('money', '0');
      }
    }

    function updateMoney() {
      const money = localStorage.getItem('money');
      const moneyAmountElement = document.getElementById('money-amount');
      if (moneyAmountElement) {
        moneyAmountElement.textContent = `¥${money}`;
      }
    }

    function updateGropeLevel() {
      const gropeLevel = localStorage.getItem('gropeLevel') || 0;
      const gropeLevelAmountElement = document.getElementById('grope-level-amount');
      if (gropeLevelAmountElement) {
        gropeLevelAmountElement.textContent = gropeLevel;
      }
    }

    initializeTime();
    initializeMoney();
    setInterval(updateClock, 60000);

    function restartGame() {
      if (confirm("Are you sure you want to restart the game?")) {
        localStorage.removeItem('gameTime');
        localStorage.removeItem('money');
        localStorage.removeItem('gropeLevel');
        window.location.href = "index.html";
      }
    }

    function saveGame() {
      const locationName = document.getElementById("location-name").textContent;
      if (!locationName) {
        alert("Could not determine current location to save.");
        return;
      }

      const gameState = {
        currentLocation: locationName,
        gameTime: localStorage.getItem('gameTime'),
        money: localStorage.getItem('money'),
        gropeLevel: localStorage.getItem('gropeLevel')
      };

      const a = document.createElement("a");
      const file = new Blob([JSON.stringify(gameState, null, 2)], {type: "application/json"});
      a.href = URL.createObjectURL(file);
      a.download = "romance-rails-save.json";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importGame() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) {
          return;
        }
        const reader = new FileReader();
        reader.onload = function(event) {
          try {
            const gameState = JSON.parse(event.target.result);
            if (gameState && gameState.currentLocation) {
              const locationFile = gameState.currentLocation.toLowerCase().replace(/\s+/g, '-') + '.html';

              if (validLocations.includes(locationFile)) {
                 if (confirm("Save file loaded. Continue to " + gameState.currentLocation + "?")) {
                    if (gameState.gameTime) {
                      localStorage.setItem('gameTime', gameState.gameTime);
                    }
                    if (gameState.money) {
                        localStorage.setItem('money', gameState.money);
                    }
                    if (gameState.gropeLevel) {
                        localStorage.setItem('gropeLevel', gameState.gropeLevel);
                    }
                    window.location.href = locationFile;
                 }
              } else {
                alert("Invalid location in save file.");
              }
            } else {
              alert("Invalid save file format.");
            }
          } catch (error) {
            alert("Error reading save file: " + error.message);
          }
        };
        reader.readAsText(file);
      }
      input.click();
    }

    function initializeTime() {
      if (!localStorage.getItem('gameTime')) {
        const startTime = new Date();
        startTime.setHours(7, 0, 0, 0);
        localStorage.setItem('gameTime', startTime.getTime());
      }
    }

    function advanceTime(hours, minutes) {
      const gameTime = new Date(parseInt(localStorage.getItem('gameTime')));
      gameTime.setHours(gameTime.getHours() + hours);
      gameTime.setMinutes(gameTime.getMinutes() + minutes);
      localStorage.setItem('gameTime', gameTime.getTime());
    }
  </script>

</body>
</html>
