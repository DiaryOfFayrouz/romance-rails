name: Fetch and Extract Game
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get install -y unrar p7zip-full megatools
      - name: Download file
        run: megadl "https://mega.nz/file/Y8wzBTJI#adFlttPZsp75fjjRvV6O4Gj9jl_IcO4sg_Y7OFvQTp0"
      - name: Rename to game.rar
        run: mv *.rar game.rar 2>/dev/null || mv *.zip game.rar 2>/dev/null || true
      - name: Check file type
        run: file game.rar
      - name: Extract archive
        run: 7z x game.rar
      - name: Delete archive
        run: rm game.rar
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Add game files"
          git push
