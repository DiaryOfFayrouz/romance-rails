name: Fetch and Extract Game
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get install -y unrar p7zip-full
      - name: Download file
        run: curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://gfve4dog1.mxcontent.net/d/el6jz9k4a6gj9o/m2c6rtpi7z3rj1n3y22tb9xe3nvl7old?ab=0&r=" -o game.rar
      - name: Check file type
        run: file game.rar
      - name: Extract archive
        run: 7z x game.rar
      - name: Check file type
        run: |
          file game.rar
          cat game.rar
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Add game files"
          git push
