name: Fetch and Extract Game
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get install -y unrar p7zip-full git-lfs
      - name: Setup LFS
        run: git lfs install
      - name: Download file
        run: curl -L "https://pixeldrain.com/api/file/fDVm3CgC" -o game.rar
      - name: Extract archive
        run: 7z x game.rar
      - name: Delete archive
        run: rm game.rar
      - name: Track videos with LFS
        run: git lfs track "*.mp4"
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .gitattributes
          git add .
          git commit -m "Add game files with LFS videos"
          git push
